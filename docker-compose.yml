version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: verixa_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-verixa_db}
      POSTGRES_USER: ${DB_USER:-verixa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-verixa_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verixa_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verixa_backend
    restart: always
    command: ./entrypoint.sh
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml_models
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=verixa_core.settings.local
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verixa_celery_worker
    restart: always
    command: celery -A verixa_core worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml_models
      - ./scrapers:/app/scrapers
    environment:
      - DJANGO_SETTINGS_MODULE=verixa_core.settings.local
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verixa_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
