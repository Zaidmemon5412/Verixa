name: Backend CI & Security Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test-and-security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Production Deployment Security Check
        env:
          DJANGO_SETTINGS_MODULE: verixa_core.settings.production
          DJANGO_SECRET_KEY: ci-verification-cryptographic-secret-key-9f8e7d6c5b4a3f2e1d0c9b8a
          DJANGO_ALLOWED_HOSTS: verixa.com,api.verixa.com
        run: |
          cd backend
          python manage.py check --deploy

      - name: Execute Automated Test Suite (Pytest)
        env:
          DJANGO_SETTINGS_MODULE: verixa_core.settings.test
        run: |
          cd backend
          pytest apps/accounts/tests.py apps/accounts/tests_password_reset.py

